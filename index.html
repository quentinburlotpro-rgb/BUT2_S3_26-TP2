    <!DOCTYPE html>
    <html lang="fr">
      <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <link href="src/style.css" rel="stylesheet" />
      </head>
      <body class="flex h-lvh w-full items-center justify-center bg-foreground xl:justify-end">
        <main class="relative flex bg-mobile bg-cover bg-no-repeat bg-center h-lvh w-full items-center justify-center bg-foreground sm:justify-start sm:bg-tablet sm:bg-auto sm:bg-top-right lg:bg-desktop lg:max-w-430 lg:max-h-200 lg:items-end lg:bg-contain lg:bg-right">
          <section class=" flex flex-col items-center justify-center gap-12 p-12 h-full sm:bg-foreground sm:h-auto sm:max-w-180 sm:justify-start sm:items-start">
        <span 
            class="[counter-reset:client-count_var(--num)] [animation:count-anim_60s_ease-out_forwards] text-2xl font-bold text-white mb-3 after:content-[counter(client-count)]"
            style="--num: 0;"
        >CLIENTS: </span>            
        <img src="src/assets/desktop/logo.svg" alt="Logo" srcset="" class="w-46 sm:absolute sm:top-12 sm:left-12 sm:w-32">
            <h1 class="text-4xl font-bold text-center text-primary sm:text-left">PUBLISH YOUR PODCASTS <span class="text-light">EVERYWHERE</span></h1>
            <p class="text-lg text-center text-muted font-bold sm:text-left">Lorem ipsum dolor sit amet consectetur adipisicing elit. Ratione non ad eius temporibus nostrum iure quidem mollitia, cumque error, iste corrupti laboriosam neque! Id animi blanditiis fugit magni magnam ex.</p>
            <div class="flex flex-col gap-12 w-full sm:flex-col-reverse">
                  <div class="relative overflow-hidden w-full flex">
                <!-- Conteneur animé avec classes arbitraires Tailwind -->
                <div class="flex gap-12 items-center animate-[marquee_25s_linear_infinite] hover:[animation-play-state:paused] shrink-0">
                  
                  <!-- Première liste -->
                  <ul class="flex gap-12 items-center shrink-0">
                    <li><img src="src/assets/desktop/apple-podcast.svg" alt="Apple Podcasts"></li>
                    <li><img src="src/assets/desktop/google-podcasts.svg" alt="Google Podcasts"></li>
                    <li><img src="src/assets/desktop/spotify.svg" alt="Spotify"></li>
                    <li><img src="src/assets/desktop/pocket-casts.svg" alt="Pocket Casts"></li>
                  </ul>

                  <!-- Deuxième liste (duplication pour la boucle infinie) -->
                  <ul class="flex gap-12 items-center shrink-0" aria-hidden="true">
                    <li><img src="src/assets/desktop/apple-podcast.svg" alt=""></li>
                    <li><img src="src/assets/desktop/google-podcasts.svg" alt=""></li>
                    <li><img src="src/assets/desktop/spotify.svg" alt=""></li>
                    <li><img src="src/assets/desktop/pocket-casts.svg" alt=""></li>
                  </ul>

                </div>
              </div>            
              <form action="" class="flex flex-col gap-4 w-full sm:flex-row sm:gap-0 sm:p-2 sm:bg-input sm:rounded-full sm:items-center sm:max-w-150">
                <input class="bg-input border border-border font-bold outline-none border-none p-4 w-full rounded-full text-muted " type="email" placeholder="Email address" required>
  
                <input class="bg-primary text-foreground border border-border font-bold outline-none border-none p-4 w-full rounded-full cursor-pointer sm:max-w-50 " type="submit" value="Request Access">
              </form>
            </div>
          </section>
        </main>
        <img src="src/assets/desktop/bg-pattern-dots.svg" alt="Image Host" class="absolute bottom-12 hidden sm:block left-12 lg:right-12 lg:left-auto">
      </body>
    </html>
